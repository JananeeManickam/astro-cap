<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astronomical Events on This Date</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #0d0d1a;
        color: #ffffff;
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
      }
      .container {
        background-color: #12122a;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(70, 146, 254, 0.3);
        padding: 30px;
      }
      h1 {
        color: rgb(70, 146, 254);
        text-align: center;
        border-bottom: 2px solid rgb(70, 146, 254);
        padding-bottom: 10px;
      }
      .date-display {
        text-align: center;
        font-size: 1.3em;
        font-weight: bold;
        margin-bottom: 20px;
        color: rgb(70, 146, 254);
      }
      .date-selector {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
        gap: 10px;
        flex-wrap: wrap;
      }
      .date-selector select,
      .date-selector button {
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #444;
        background-color: #1f1f3a;
        color: white;
        transition: all 0.3s ease;
      }
      .date-selector select:hover,
      .date-selector button:hover {
        border-color: rgb(70, 146, 254);
        background-color: #2a2a4a;
      }
      .date-selector button {
        background-color: rgb(70, 146, 254);
        border: none;
        font-weight: bold;
        color: #fff;
      }
      .date-selector button:hover {
        background-color: #368eff;
      }
      .tab-container {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .tab {
        padding: 10px 20px;
        background-color: #1c1c36;
        color: white;
        cursor: pointer;
        border: 1px solid #333;
        border-radius: 6px 6px 0 0;
        margin: 0 5px;
        transition: all 0.3s ease;
      }
      .tab:hover {
        background-color: #2d2d4d;
        border-color: rgb(70, 146, 254);
      }
      .tab.active {
        background-color: rgb(70, 146, 254);
        color: white;
        font-weight: bold;
      }
      .tab-content {
        border-top: 1px solid #333;
        padding-top: 20px;
      }
      #events-container {
        margin-top: 20px;
      }
      .event-card {
        background-color: #1a1a3b;
        border-left: 4px solid rgb(70, 146, 254);
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 6px;
        transition: background-color 0.3s ease;
      }
      .event-card:hover {
        background-color: #23234a;
      }
      .event-type {
        font-weight: bold;
        color: rgb(70, 146, 254);
        margin-bottom: 5px;
      }
      .event-description {
        color: #ccc;
      }
      .loading {
        text-align: center;
        color: #999;
        padding: 20px;
      }
      .error {
        color: #ff6b6b;
        background-color: #3d1e1e;
        text-align: center;
        padding: 20px;
        border-radius: 6px;
        margin-top: 20px;
        border: 1px solid #ff6b6b;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🌌 Astronomical Events on This Date 🚀</h1>

      <div id="date-display" class="date-display"></div>

      <div class="tab-container">
        <div id="today-tab" class="tab active" onclick="switchTab('today')">
          Today's Events
        </div>
        <div id="custom-tab" class="tab" onclick="switchTab('custom')">
          Select Custom Date
        </div>
      </div>

      <div
        id="custom-date-selector"
        class="date-selector"
        style="display: none"
      >
        <select id="month-selector">
          <option value="">Select Month</option>
          <option value="1">January</option>
          <option value="2">February</option>
          <option value="3">March</option>
          <option value="4">April</option>
          <option value="5">May</option>
          <option value="6">June</option>
          <option value="7">July</option>
          <option value="8">August</option>
          <option value="9">September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12">December</option>
        </select>

        <select id="day-selector">
          <option value="">Select Day</option>
        </select>

        <button onclick="fetchCustomDate()">Show Events</button>
      </div>

      <div id="events-container">
        <div class="loading">Loading today's astronomical events...</div>
      </div>
    </div>

    <script>
      const monthNames = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];
      const monthSelector = document.getElementById("month-selector");
      const daySelector = document.getElementById("day-selector");
      const eventsContainer = document.getElementById("events-container");
      const dateDisplay = document.getElementById("date-display");
      const customDateSelector = document.getElementById(
        "custom-date-selector"
      );

      // Initialize the page by fetching today's events
      document.addEventListener("DOMContentLoaded", fetchTodayEvents);

      // Function to handle tab switching
      function switchTab(tab) {
        if (tab === "today") {
          document.getElementById("today-tab").classList.add("active");
          document.getElementById("custom-tab").classList.remove("active");
          customDateSelector.style.display = "none";
          fetchTodayEvents();
        } else {
          document.getElementById("custom-tab").classList.add("active");
          document.getElementById("today-tab").classList.remove("active");
          customDateSelector.style.display = "flex";
        }
      }

      // Function to determine if a year is a leap year
      function isLeapYear(year) {
        return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
      }

      // Function to update the day selector based on the selected month
      function updateDaySelector(monthIndex) {
        const currentYear = new Date().getFullYear();
        const daysInMonth = [
          31, // January
          isLeapYear(currentYear) ? 29 : 28, // February
          31, // March
          30, // April
          31, // May
          30, // June
          31, // July
          31, // August
          30, // September
          31, // October
          30, // November
          31  // December
        ];
        
        daySelector.innerHTML = '<option value="">Select Day</option>';
        
        if (monthIndex >= 0 && monthIndex < 12) {
          const numberOfDays = daysInMonth[monthIndex];
          for (let i = 1; i <= numberOfDays; i++) {
            const option = document.createElement("option");
            option.value = i;
            option.textContent = i;
            daySelector.appendChild(option);
          }
        }
      }

      // Add event listener for the month selector
      monthSelector.addEventListener("change", function() {
        const selectedMonthIndex = parseInt(this.value) - 1;
        if (selectedMonthIndex >= 0) {
          updateDaySelector(selectedMonthIndex);
        } else {
          daySelector.innerHTML = '<option value="">Select Day</option>';
        }
      });

      // Function to fetch today's events
      function fetchTodayEvents() {
        eventsContainer.innerHTML =
          '<div class="loading">Loading today\'s astronomical events...</div>';
        
        const today = new Date();
        const month = today.getMonth();
        const day = today.getDate();
        
        dateDisplay.textContent = `${monthNames[month]} ${day}`;
        
        // Simulate API call (replace with your actual API endpoint)
        axios
          .get("/api/onthisdate/events/")
          .then((response) => {
            const { events, current_date } = response.data;
            dateDisplay.textContent = `${
              current_date.month_name || monthNames[current_date.month - 1]
            } ${current_date.day}`;
            renderEvents(events);
          })
          .catch(handleError);
      }

      // Function to fetch events for a custom date
      function fetchCustomDate() {
        const month = monthSelector.value;
        const day = daySelector.value;
        if (!month || !day) {
          alert("Please select both month and day");
          return;
        }
        
        eventsContainer.innerHTML =
          '<div class="loading">Loading astronomical events...</div>';
        
        dateDisplay.textContent = `${monthNames[month - 1]} ${day}`;
        
        // Simulate API call (replace with your actual API endpoint)
        axios
          .post("/api/onthisdate/events/", { month, day })
          .then((response) => {
            const { events, current_date } = response.data;
            dateDisplay.textContent = `${
              current_date.month_name || monthNames[month - 1]
            } ${day}`;
            renderEvents(events);
          })
          .catch(handleError);
      }

      // Function to render events
      function renderEvents(events) {
        if (!events || events.length === 0) {
          eventsContainer.innerHTML =
            '<div class="error">No astronomical events found for this date.</div>';
          return;
        }
        
        eventsContainer.innerHTML = events
          .map(
            (event) => `
          <div class="event-card">
            <div class="event-type">${event.event_type} - ${event.year}</div>
            <div class="event-description">${event.event_description}</div>
          </div>
        `
          )
          .join("");
      }

      // Function to handle errors
      function handleError(error) {
        let errorMessage =
          "Failed to fetch astronomical events. Please try again later.";
        if (error.response?.data?.error) {
          errorMessage = error.response.data.error;
        }
        eventsContainer.innerHTML = `<div class="error">${errorMessage}</div>`;
      }
    </script>
  </body>
</html>
